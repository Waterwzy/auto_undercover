name : auto_relase_public

on : 
    push : 
        branches : [main]
        tags : ['v*']
    pull_request :
        branches : ['main']

jobs :
    test :
        runs-on : ubuntu-latest
        steps :
            - uses : actions/checkout@v3
            - uses : actions/setup-python@v4
              with :
                python-version : "3.12.10"
            - run : pip install -r requirements.txt
            - run: |
                if find . -name "test_*.py" | grep -q "." || find . -name "*_test.py" | grep -q "."; then
                    echo "Running tests..."
                    pytest --cov=. --cov-report=xml
                else
                    echo "No test files found, skipping tests"
                fi

    lint :
        runs-on : ubuntu-latest
        steps :
            - uses : actions/checkout@v3
            - uses : actions/setup-python@v4
              with :
                python-version : "3.12.10"
            - run : pip install black flake8 mypy -r requirements.txt
            - name: Find Python files
              run: |
                    python_files=$(find . -name "*.py" -not -path "./.*" -not -path "*/__pycache__/*" -not -path "*/venv/*" -not -path "*/env/*")
                    if [ -z "$python_files" ]; then
                        echo "No Python files found for linting"
                        echo "python_files=" >> $GITHUB_ENV
                    else
                        echo "Found Python files:"
                        echo "$python_files"
                        echo "python_files=$python_files" >> $GITHUB_ENV
                    fi
        
            - name: Run black
              run: |
                if [ -n "$python_files" ]; then
                    echo "Checking code formatting with black..."
                    black --check $python_files
                else
                    echo "Skipping black - no Python files found"
                fi
            
            - name: Run flake8
              run: |
                if [ -n "$python_files" ]; then
                    echo "Running flake8..."
                    flake8 $python_files
                else
                    echo "Skipping flake8 - no Python files found"
                fi
            
            - name: Run mypy
              run: |
                if [ -n "$python_files" ]; then
                    echo "Running mypy..."
                    mypy $python_files
                else
                    echo "Skipping mypy - no Python files found"
                fi

    build :
        needs : [test,lint]
        strategy :
            matrix :
                os : [ubuntu-latest,windows-latest,macos-latest]
        runs-on : ${{matrix.os}}
        steps :
            - uses : actions/checkout@v3
            - uses : actions/setup-python@v4
              with :
                python-version : "3.12.10"
            - run : pip install pyinstaller -r requirements.txt 
            - run : pyinstaller --onefile main.py
            - uses : actions/upload-artifact@v4
              with :
                name : ${{matrix.os}}-executable
                path: dist/
            
    release :
        needs: build
        if: startsWith(github.ref,'refs/tags/')
        runs-on : ubuntu-latest
        permissions :
            contents : write
        steps :
            - uses : actions/download-artifact@v4
              with :
                path : artifacts
            - uses : softprops/action-gh-release@v1
              with :
                files: |
                    artifacts/**/*


